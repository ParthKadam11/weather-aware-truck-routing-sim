services:
  - type: web
    name: weather-truck-routing-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_STORM
        value: "0"
      - key: WEATHER_CACHE_TTL_S
        value: "900"
      - key: DEFAULT_DISPLAY_TZ
        value: "America/Chicago"
